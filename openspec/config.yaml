schema: spec-driven

context: |
  Backend NestJS 11 para TechStore System.
  Stack: NestJS 11, TypeScript 5.7, TypeORM, MySQL, Jest, Supertest, ESLint, Prettier.
  Arquitectura: API modular basada en src/<domain> con controllers, services, dto y entities.
  Testing: Jest para unit/integration y e2e config en test/.
  Calidad: lint con ESLint, format con Prettier, type-check con TypeScript.

strict_tdd: true

rules:
  proposal:
    - Mantener artifacts breves y con rollback explícito.
    - Contrastar siempre contra el estado implementado antes de escribir.
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: 2026-04-29
  runner:
    command: npm run test
    framework: Jest
  layers:
    unit: Jest
    integration: Jest + Supertest
    e2e: Jest e2e config
  coverage:
    available: true
    command: npm run test:cov
  quality:
    linter: npm run lint
    type_checker: npx tsc --noEmit
    formatter: npm run format
